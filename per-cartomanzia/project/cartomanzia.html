<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartomanzia AI</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0810;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: Georgia, 'Times New Roman', serif;
}
.phone {
  width: 390px; height: 844px;
  position: relative; overflow: hidden;
  border-radius: 44px;
  box-shadow: 0 0 80px rgba(100,60,20,0.6), 0 0 160px rgba(80,30,100,0.3);
}

/* ── KEYFRAMES ── */
@keyframes fadeUp    { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes twinkle   { 0%,100%{opacity:.2} 50%{opacity:.9} }
@keyframes breathe   { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-6px) scale(1.015)} }
@keyframes floatOrb  { 0%,100%{transform:scale(1);filter:brightness(1)} 50%{transform:scale(1.06);filter:brightness(1.3) drop-shadow(0 0 18px #D4AF37)} }
@keyframes jawAnim   { 0%,100%{d:path("M128 204 Q160 218 192 204 Q190 214 160 220 Q130 214 128 204Z")} 50%{d:path("M128 204 Q160 228 192 204 Q190 220 160 230 Q130 220 128 204Z")} }
@keyframes handLAnim { 0%,100%{transform:rotate(-4deg) translate(0,0)} 50%{transform:rotate(6deg) translate(-5px,3px)} }
@keyframes handRAnim { 0%,100%{transform:rotate(4deg) translate(0,0)} 50%{transform:rotate(-6deg) translate(5px,3px)} }
@keyframes eyePulse  { 0%,100%{fill:#6B4BA0;r:6} 50%{fill:#D4AF37;r:7} }
@keyframes cardFlip  { from{transform:rotateY(90deg) scale(.85);opacity:0} to{transform:rotateY(0) scale(1);opacity:1} }
@keyframes slideIn   { from{transform:translateX(-20px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes goldShimmer { 0%,100%{stop-color:#8B7020} 50%{stop-color:#F0D060} }
@keyframes smokeUp   { 0%{opacity:0;transform:translateY(0) scaleX(1)} 60%{opacity:.35} 100%{opacity:0;transform:translateY(-50px) scaleX(2.2)} }
@keyframes orbInner  { 0%,100%{opacity:.4;transform:rotate(0deg)} 50%{opacity:.8;transform:rotate(180deg)} }
@keyframes pulse     { 0%,100%{box-shadow:0 0 8px rgba(212,175,55,.35)} 50%{box-shadow:0 0 22px rgba(212,175,55,.75),0 0 44px rgba(212,175,55,.2)} }
</style>
</head>
<body style="font-family: &quot;Times New Roman&quot;">
<div class="phone" id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ═══ PALETTE ═══ */
const G = {
  bg:       '#100c1e',
  stone:    '#1a1428',
  card:     '#1e1535',
  purpleDk: '#2a1a4a',
  purple:   '#3d1b69',
  purpleMd: '#5a2e8a',
  purpleLt: '#6b4ba0',
  gold:     '#D4AF37',
  goldLt:   '#F0D060',
  goldDk:   '#8B7020',
  goldMid:  '#c4a030',
  bone:     '#E8D5A0',
  text:     '#E8D5A3',
  textDim:  '#9a8060',
  textMid:  '#c4a878',
  green:    '#3a6b2a',
};

/* ═══ STONE BACKGROUND ═══ */
const stoneBg = `
  radial-gradient(ellipse at 30% 20%, rgba(80,40,120,.45) 0%, transparent 55%),
  radial-gradient(ellipse at 70% 80%, rgba(60,30,90,.35) 0%, transparent 50%),
  radial-gradient(ellipse at 50% 50%, rgba(30,20,50,.6) 0%, transparent 80%),
  linear-gradient(160deg, #18102a 0%, #100c1e 40%, #0d0918 100%)
`;

/* ═══ GOLD GRADIENT DEF (reused) ═══ */
const GoldDefs = () => (
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stopColor="#6B5010"/>
      <stop offset="25%" stopColor="#D4AF37"/>
      <stop offset="50%" stopColor="#F0D060"/>
      <stop offset="75%" stopColor="#D4AF37"/>
      <stop offset="100%" stopColor="#6B5010"/>
    </linearGradient>
    <linearGradient id="gg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stopColor="#D4AF37"/>
      <stop offset="100%" stopColor="#6B5010"/>
    </linearGradient>
    <radialGradient id="gemR" cx="40%" cy="35%">
      <stop offset="0%"  stopColor="#c090f0"/>
      <stop offset="60%" stopColor="#6B4BA0"/>
      <stop offset="100%" stopColor="#2a1050"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
);

/* ═══ ELABORATE FRAME SVG ═══ */
function ElaborateFrame() {
  return (
    <svg style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:10}}
         width="390" height="844" viewBox="0 0 390 844">
      <GoldDefs/>

      {/* Outer edge */}
      <rect x="2" y="2" width="386" height="840" rx="42" ry="42"
        fill="none" stroke="url(#gg)" strokeWidth="7" opacity=".95"/>
      <rect x="6" y="6" width="378" height="832" rx="40" ry="40"
        fill="none" stroke="#D4AF37" strokeWidth="1.5" opacity=".3"/>

      {/* Inner oval arch */}
      <ellipse cx="195" cy="408" rx="176" ry="370"
        fill="none" stroke="url(#gg)" strokeWidth="5" opacity=".85"/>
      <ellipse cx="195" cy="408" rx="172" ry="366"
        fill="none" stroke="#D4AF37" strokeWidth="1" opacity=".25"/>

      {/* TOP CENTER FLEUR-DE-LIS */}
      <g transform="translate(195,14)">
        <path d="M0,-10 C-4,-6 -6,0 0,6 C6,0 4,-6 0,-10Z" fill="url(#gg)"/>
        <path d="M-8,-4 C-10,0 -8,6 0,8 C8,6 10,0 8,-4Z" fill="url(#gg)" opacity=".7"/>
        <circle cx="0" cy="0" r="3.5" fill="#D4AF37"/>
        <path d="M0,6 L0,18" stroke="url(#gg)" strokeWidth="2"/>
        <path d="M-6,10 Q0,14 6,10" fill="none" stroke="url(#gg)" strokeWidth="1.5"/>
      </g>

      {/* Filigree top corners */}
      {/* Top-left */}
      <g opacity=".9">
        <path d="M14,40 C14,30 20,24 30,18" fill="none" stroke="url(#gg)" strokeWidth="2.5"/>
        <path d="M20,50 C20,38 28,30 42,22" fill="none" stroke="#D4AF37" strokeWidth="1.5" opacity=".6"/>
        <path d="M28,60 C28,48 36,38 52,28" fill="none" stroke="#D4AF37" strokeWidth="1" opacity=".4"/>
        {/* Corner vines */}
        <path d="M14,70 C18,60 26,52 38,46 C50,40 60,38 70,34" fill="none" stroke="url(#gg)" strokeWidth="2"/>
        <path d="M30,82 C40,72 52,64 66,58" fill="none" stroke="#D4AF37" strokeWidth="1.5" opacity=".6"/>
        {/* Leaf details */}
        <ellipse cx="45" cy="38" rx="5" ry="3" fill="url(#gg)" opacity=".7" transform="rotate(-30,45,38)"/>
        <ellipse cx="60" cy="30" rx="4" ry="2.5" fill="url(#gg)" opacity=".6" transform="rotate(-50,60,30)"/>
        <ellipse cx="32" cy="65" rx="4" ry="2" fill="url(#gg)" opacity=".6" transform="rotate(-10,32,65)"/>
      </g>
      {/* Top-right (mirror) */}
      <g opacity=".9" transform="scale(-1,1) translate(-390,0)">
        <path d="M14,40 C14,30 20,24 30,18" fill="none" stroke="url(#gg)" strokeWidth="2.5"/>
        <path d="M20,50 C20,38 28,30 42,22" fill="none" stroke="#D4AF37" strokeWidth="1.5" opacity=".6"/>
        <path d="M28,60 C28,48 36,38 52,28" fill="none" stroke="#D4AF37" strokeWidth="1" opacity=".4"/>
        <path d="M14,70 C18,60 26,52 38,46 C50,40 60,38 70,34" fill="none" stroke="url(#gg)" strokeWidth="2"/>
        <path d="M30,82 C40,72 52,64 66,58" fill="none" stroke="#D4AF37" strokeWidth="1.5" opacity=".6"/>
        <ellipse cx="45" cy="38" rx="5" ry="3" fill="url(#gg)" opacity=".7" transform="rotate(-30,45,38)"/>
        <ellipse cx="60" cy="30" rx="4" ry="2.5" fill="url(#gg)" opacity=".6" transform="rotate(-50,60,30)"/>
        <ellipse cx="32" cy="65" rx="4" ry="2" fill="url(#gg)" opacity=".6" transform="rotate(-10,32,65)"/>
      </g>

      {/* Bottom corners */}
      <g opacity=".9" transform="scale(1,-1) translate(0,-844)">
        <path d="M14,40 C14,30 20,24 30,18" fill="none" stroke="url(#gg)" strokeWidth="2.5"/>
        <path d="M14,70 C18,60 26,52 38,46 C50,40 60,38 70,34" fill="none" stroke="url(#gg)" strokeWidth="2"/>
        <path d="M30,82 C40,72 52,64 66,58" fill="none" stroke="#D4AF37" strokeWidth="1.5" opacity=".6"/>
        <ellipse cx="45" cy="38" rx="5" ry="3" fill="url(#gg)" opacity=".7" transform="rotate(-30,45,38)"/>
      </g>
      <g opacity=".9" transform="scale(-1,-1) translate(-390,-844)">
        <path d="M14,40 C14,30 20,24 30,18" fill="none" stroke="url(#gg)" strokeWidth="2.5"/>
        <path d="M14,70 C18,60 26,52 38,46 C50,40 60,38 70,34" fill="none" stroke="url(#gg)" strokeWidth="2"/>
        <path d="M30,82 C40,72 52,64 66,58" fill="none" stroke="#D4AF37" strokeWidth="1.5" opacity=".6"/>
        <ellipse cx="45" cy="38" rx="5" ry="3" fill="url(#gg)" opacity=".7" transform="rotate(-30,45,38)"/>
      </g>

      {/* GEMS — corners */}
      {[[16,16],[374,16],[16,828],[374,828]].map(([cx,cy],i)=>(
        <g key={i}>
          <circle cx={cx} cy={cy} r="12" fill="url(#gg)" />
          <circle cx={cx} cy={cy} r="9"  fill="url(#gemR)" />
          <circle cx={cx-3} cy={cy-3} r="3" fill="rgba(255,255,255,.3)"/>
          <circle cx={cx} cy={cy} r="12" fill="none" stroke="url(#gg)" strokeWidth="1.5"/>
        </g>
      ))}

      {/* GEMS — side midpoints */}
      {[[6,422],[384,422]].map(([cx,cy],i)=>(
        <g key={i}>
          <circle cx={cx} cy={cy} r="8" fill="url(#gg)"/>
          <circle cx={cx} cy={cy} r="5.5" fill="url(#gemR)"/>
          <circle cx={cx-2} cy={cy-2} r="2" fill="rgba(255,255,255,.3)"/>
        </g>
      ))}

      {/* TOP small gems along arch */}
      {[120,155,195,235,270].map((x,i)=>(
        <g key={i}>
          <path d={`M${x},${i===2?8:10} L${x+4},${i===2?14:16} L${x},${i===2?20:22} L${x-4},${i===2?14:16}Z`}
            fill="url(#gemR)" stroke="url(#gg)" strokeWidth="1"/>
        </g>
      ))}

      {/* Horizontal decorative band — top & bottom of content area */}
      <line x1="14" y1="770" x2="376" y2="770" stroke="url(#gg)" strokeWidth="3" opacity=".8"/>
      <line x1="14" y1="774" x2="376" y2="774" stroke="#D4AF37" strokeWidth="1" opacity=".3"/>
    </svg>
  );
}

/* ═══ TITLE BOX ═══ */
function TitleBox({children, sub}) {
  return (
    <div style={{textAlign:'center',padding:'14px 30px 6px',animation:'fadeUp .5s ease'}}>
      <div style={{
        background:'linear-gradient(135deg,#2a1550 0%,#3d1b69 50%,#2a1550 100%)',
        border:'2px solid #D4AF37',
        borderRadius:4, padding:'10px 18px',
        boxShadow:'inset 0 0 24px rgba(107,75,160,.5), 0 0 18px rgba(212,175,55,.25)',
        position:'relative',
      }}>
        {/* corner accents */}
        {[[-1,-1],[1,-1],[-1,1],[1,1]].map(([sx,sy],i)=>(
          <div key={i} style={{
            position:'absolute',
            top: sy<0?-4:'auto', bottom:sy>0?-4:'auto',
            left:sx<0?-4:'auto', right:sx>0?-4:'auto',
            width:8, height:8,
            border:'2px solid #D4AF37',
            borderRadius:1,
          }}/>
        ))}
        <div style={{
          color:'#D4AF37', fontSize:20, fontWeight:700,
          letterSpacing:3, textShadow:'0 0 12px rgba(212,175,55,.6)',
          textTransform:'uppercase',
        }}>{children}</div>
      </div>
      {/* diamond divider */}
      <div style={{display:'flex',alignItems:'center',gap:6,margin:'8px 10px 0'}}>
        <div style={{flex:1,height:1,background:'linear-gradient(90deg,transparent,#D4AF37,transparent)'}}/>
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path d="M6,0 L12,6 L6,12 L0,6Z" fill="#D4AF37"/>
          <path d="M6,2 L10,6 L6,10 L2,6Z" fill="#3d1b69"/>
        </svg>
        <div style={{flex:1,height:1,background:'linear-gradient(90deg,transparent,#D4AF37,transparent)'}}/>
      </div>
      {sub&&<div style={{fontSize:10,color:G.textDim,letterSpacing:2,marginTop:4,textTransform:'uppercase'}}>{sub}</div>}
    </div>
  );
}

/* ═══ SEARCH BAR ═══ */
function SearchBar({placeholder}) {
  const [v,setV]=useState('');
  return (
    <div style={{padding:'6px 20px'}}>
      <div style={{
        display:'flex',alignItems:'center',gap:8,
        background:'rgba(30,21,53,.9)',
        border:'1.5px solid #8B7020',
        borderRadius:4, padding:'8px 12px',
        boxShadow:'inset 0 0 12px rgba(61,27,105,.4)',
      }}>
        <svg width="15" height="15" fill="none" stroke="#D4AF37" strokeWidth="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input value={v} onChange={e=>setV(e.target.value)} placeholder={placeholder}
          style={{flex:1,background:'transparent',border:'none',outline:'none',
            color:G.text,fontFamily:'Georgia,serif',fontSize:13,letterSpacing:.5}}/>
      </div>
    </div>
  );
}

/* ═══ FILTER CHIPS ═══ */
function Chips({items}) {
  const [a,setA]=useState(0);
  return (
    <div style={{display:'flex',gap:6,padding:'4px 20px',overflowX:'auto'}}>
      {items.map((c,i)=>(
        <button key={i} onClick={()=>setA(i)} style={{
          background: a===i
            ? 'linear-gradient(135deg,#8B7020,#D4AF37)'
            : 'rgba(30,21,53,.9)',
          border:`1.5px solid ${a===i?'#F0D060':'#6B5010'}`,
          borderRadius:20, padding:'5px 14px',
          color: a===i?'#0d0918':'#D4AF37',
          fontFamily:'Georgia,serif', fontSize:11,
          cursor:'pointer', whiteSpace:'nowrap',
          letterSpacing:.5,
          animation:`slideIn .3s ease ${i*.05}s both`,
        }}>{c}</button>
      ))}
    </div>
  );
}

/* ═══ TAB BAR ═══ */
function TabBar({active,onChange}) {
  const tabs = [
    {id:'home',    label:'HOME',      path:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z'},
    {id:'profile', label:'PROFILO',   path:'M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z'},
    {id:'reading', label:'LETTURE',   path:'M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z'},
    {id:'history', label:'CRONOLOGIA',path:'M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z'},
    {id:'settings',label:'IMPOSTA',   path:'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z'},
  ];
  return (
    <div style={{
      position:'absolute',bottom:0,left:0,right:0,height:72,
      background:'linear-gradient(180deg,#0d0918 0%,#100c1e 100%)',
      borderTop:'3px solid #8B7020',
      display:'flex', zIndex:50,
    }}>
      {tabs.map((t,i)=>{
        const isA = active===t.id;
        return (
          <button key={t.id} onClick={()=>onChange(t.id)} style={{
            flex:1,
            display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
            gap:3, background:'transparent', border:'none', cursor:'pointer',
            borderRight: i<tabs.length-1 ? '1px solid rgba(139,112,32,.3)' : 'none',
            borderTop: isA ? '2px solid #D4AF37' : '2px solid transparent',
            marginTop:-3,
            transition:'all .2s',
          }}>
            <div style={{
              width:36,height:36,borderRadius:'50%',
              background: isA
                ? 'radial-gradient(circle,#6b4ba0 0%,#3d1b69 60%,#2a1040 100%)'
                : 'transparent',
              display:'flex',alignItems:'center',justifyContent:'center',
              boxShadow: isA ? '0 0 14px rgba(107,75,160,.7)' : 'none',
              transition:'all .3s',
            }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill={isA?'#D4AF37':'#5a4a30'}>
                <path d={t.path}/>
              </svg>
            </div>
            <span style={{
              fontSize:8, letterSpacing:.8,
              color: isA ? '#D4AF37' : '#5a4a30',
              fontFamily:'Georgia,serif',
            }}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ═══════════════════════════════════
   SCREEN: AUTH
═══════════════════════════════════ */
function ScreenAuth({onLogin}) {
  return (
    <div style={{width:'100%',height:'100%',position:'relative',background:stoneBg,overflow:'hidden'}}>
      {/* Stars */}
      <svg style={{position:'absolute',inset:0,pointerEvents:'none'}} width="390" height="844">
        {Array.from({length:35},(_,i)=>(
          <circle key={i} cx={20+Math.random()*350} cy={80+Math.random()*680}
            r={.4+Math.random()*1.4} fill="#F0D060"
            style={{animation:`twinkle ${1.5+Math.random()*2.5}s ${Math.random()*3}s ease-in-out infinite`}}/>
        ))}
      </svg>

      <ElaborateFrame/>

      {/* Title */}
      <div style={{position:'absolute',top:36,left:50,right:50,textAlign:'center',animation:'fadeUp .5s ease'}}>
        <div style={{
          background:'linear-gradient(135deg,#2a1550,#3d1b69,#2a1550)',
          border:'2px solid #D4AF37',borderRadius:4,padding:'10px 16px',
          boxShadow:'inset 0 0 20px rgba(107,75,160,.5),0 0 18px rgba(212,175,55,.3)',
        }}>
          <div style={{color:'#D4AF37',fontSize:18,fontWeight:700,letterSpacing:3}}>ACCESSO ACCOUNT</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,margin:'8px 0 0'}}>
          <div style={{flex:1,height:1,background:'linear-gradient(90deg,transparent,#D4AF37,transparent)'}}/>
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5,0L10,5L5,10L0,5Z" fill="#D4AF37"/></svg>
          <div style={{flex:1,height:1,background:'linear-gradient(90deg,transparent,#D4AF37,transparent)'}}/>
        </div>
      </div>

      {/* Center elaborate filigree + Google button */}
      <div style={{
        position:'absolute',top:'50%',left:'50%',
        transform:'translate(-50%,-50%)',
        display:'flex',flexDirection:'column',alignItems:'center',
        animation:'breathe 4s ease-in-out infinite',
      }}>
        <svg width="300" height="300" viewBox="0 0 300 300">
          <defs>
            <radialGradient id="authBg" cx="40%" cy="35%">
              <stop offset="0%" stopColor="#5a2a90"/>
              <stop offset="60%" stopColor="#3d1b69"/>
              <stop offset="100%" stopColor="#1e0e3a"/>
            </radialGradient>
            <linearGradient id="authGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="#6B5010"/>
              <stop offset="40%" stopColor="#F0D060"/>
              <stop offset="100%" stopColor="#6B5010"/>
            </linearGradient>
          </defs>

          {/* Outer swirl ring */}

          <path d="M116 62 Q118 74 114 88" fill="none" stroke="rgba(0,0,0,.13)" strokeWidth=".8"/>
          <path d="M128 65 Q130 76 128 89" fill="none" stroke="rgba(0,0,0,.1)"  strokeWidth=".7"/>

          {/* Forehead gem */}
          <circle cx="120" cy="76" r="7.5" fill="#3d1b69" stroke="#D4AF37" strokeWidth="2"/>
          <path d="M120 70 L123 76 L120 73 L117 76Z" fill="#D4AF37" opacity=".95"/>
          <circle cx="120" cy="82" r="3.8" fill="url(#gemSkull)"/>
          <circle cx="118" cy="80" r="1.5" fill="rgba(255,255,255,.35)"/>

          {/* Gold earrings */}
          <circle cx="64"  cy="118" r="5.5" fill="none" stroke="#D4AF37" strokeWidth="2"/>
          <circle cx="64"  cy="126" r="3.2" fill="url(#gemSkull)" stroke="#D4AF37" strokeWidth="1.2"/>
          <circle cx="176" cy="118" r="5.5" fill="none" stroke="#D4AF37" strokeWidth="2"/>
          <circle cx="176" cy="126" r="3.2" fill="url(#gemSkull)" stroke="#D4AF37" strokeWidth="1.2"/>

          {/* ── EYE SOCKETS ── */}
          {/* Left */}
          <ellipse cx="94"  cy="114" rx="18" ry="16" fill="#0c0818"/>
          {/* Right */}
          <ellipse cx="146" cy="114" rx="18" ry="16" fill="#0c0818"/>
          {/* Glow inner left */}
          <ellipse cx="94"  cy="114" rx="11" ry="10" fill="#2d1555"
            style={{animation:'eyePulse 2.2s ease-in-out infinite'}}/>
          {/* Glow inner right */}
          <ellipse cx="146" cy="114" rx="11" ry="10" fill="#2d1555"
            style={{animation:'eyePulse 2.2s .4s ease-in-out infinite'}}/>
          {/* Pupil left */}
          <circle cx="94"  cy="114" r="4.5" fill="#7040a8" opacity=".9"/>
          <circle cx="146" cy="114" r="4.5" fill="#7040a8" opacity=".9"/>
          {/* Glint */}
          <circle cx="92"  cy="112" r="1.8" fill="rgba(255,255,255,.35)"/>
          <circle cx="144" cy="112" r="1.8" fill="rgba(255,255,255,.35)"/>

          {/* ── NOSE CAVITY ── */}
          <path d="M113 140 Q120 147 127 140 Q124 151 120 153 Q116 151 113 140Z"
            fill="#0c0818"/>

          {/* ── CHEEKBONES ── */}
          <path d="M68 120 Q76 130 78 142" fill="none" stroke="rgba(240,200,140,.18)" strokeWidth="3.5"/>
          <path d="M172 120 Q164 130 162 142" fill="none" stroke="rgba(240,200,140,.18)" strokeWidth="3.5"/>

          {/* ── UPPER JAW ── */}
          <path d="M80 153 Q120 162 160 153 L160 160 Q120 169 80 160Z"
            fill="url(#skullG)" stroke="#c8a060" strokeWidth="1"/>
          {/* Upper teeth — 8 evenly spaced */}
          {[-28,-20,-12,-4,4,12,20,28].map((dx,i)=>(
            <rect key={i} x={120+dx-3} y={158} width="6.5" height="9" rx="1.5"
              fill="#f2eacc" stroke="#c8a060" strokeWidth=".6"/>
          ))}

          {/* ── LOWER JAW animated ── */}
          <g style={{
            transformOrigin:'120px 162px',
            transform: jawOpen ? 'rotateX(25deg)' : 'rotateX(0deg)',
            transition:'transform .11s ease',
          }}>
            <path d="M82 168 Q120 186 158 168 Q156 179 120 188 Q84 179 82 168Z"
              fill="url(#skullG)" stroke="#c8a060" strokeWidth="1"/>
            {[-24,-16,-8,0,8,16].map((dx,i)=>(
              <rect key={i} x={120+dx-3} y={168} width="6.5" height="8.5" rx="1.5"
                fill="#f2eacc" stroke="#c8a060" strokeWidth=".6"/>
            ))}
          </g>
        </svg>
      </div>

      {/* TAROT CARDS */}
      {phase==='cards' && (
        <div style={{
          position:'absolute',bottom:78,left:10,right:10,zIndex:20,
          display:'flex',justifyContent:'center',gap:10,flexWrap:'wrap',
          padding:'0 8px',
        }}>
          {allCards.slice(0,cardCount).map((c,i)=>{
            const w = cardCount===1?110:cardCount<=3?86:68;
            const h = cardCount===1?165:cardCount<=3?130:105;
            return (
              <div key={i} style={{
                width:w,height:h,
                background:'linear-gradient(160deg,#2a1550,#1a0e38)',
                border:`2px solid ${c.col}`,
                borderRadius:8,
                display:'flex',flexDirection:'column',
                alignItems:'center',justifyContent:'center',gap:4,
                opacity: i<shownCards?1:0,
                animation: i<shownCards?`cardFlip .5s ease ${i*.06}s both`:'none',
                boxShadow:`0 0 16px ${c.col}44,inset 0 0 10px rgba(0,0,0,.4)`,
                cursor:'pointer',
              }}>
                <div style={{fontSize:10,color:c.col,letterSpacing:1,fontWeight:700}}>{c.num}</div>
                <div style={{
                  width:cardCount<=3?36:28,height:cardCount<=3?36:28,
                  borderRadius:'50%',
                  background:`${c.col}22`,
                  border:`1.5px solid ${c.col}`,
                  display:'flex',alignItems:'center',justifyContent:'center',
                }}>
                  <div style={{
                    width:cardCount<=3?14:10,height:cardCount<=3?14:10,
                    background:c.col,transform:'rotate(45deg)',borderRadius:2,
                  }}/>
                </div>
                <div style={{
                  fontSize:cardCount<=3?9:7,color:'#E8D5A3',
                  textAlign:'center',padding:'0 3px',lineHeight:1.2,
                }}>{c.name}</div>
              </div>
            );
          })}
        </div>
      )}

      <TabBar active="reading" onChange={onNavigate}/>
    </div>
  );
}

/* ═══════════════════════════════════
   APP ROOT
═══════════════════════════════════ */
function App() {
  const [screen,setScreen]=useState('auth');
  const [spread,setSpread]=useState(null);

  const nav=(id)=>setScreen(id);
  const begin=(sp)=>{setSpread(sp);setScreen('skull');};

  return (
    <div style={{width:'100%',height:'100%',position:'relative'}}>
      {screen==='auth'    && <ScreenAuth     onLogin={()=>setScreen('home')}/>}
      {screen==='home'    && <ScreenHome     onNavigate={nav}/>}
      {screen==='profile' && <ScreenProfile  onNavigate={nav}/>}
      {screen==='reading' && <ScreenReading  onNavigate={nav} onBegin={begin}/>}
      {screen==='skull'   && <ScreenSkull    spread={spread} onNavigate={nav}/>}
      {screen==='history' && <ScreenHistory  onNavigate={nav}/>}
      {screen==='settings'&& <ScreenSettings onNavigate={nav}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
